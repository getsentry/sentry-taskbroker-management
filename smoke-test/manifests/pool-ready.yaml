# A stand-in for a healthy taskbroker pool: a Deployment named `task-<pool>-broker`
# (pool = "smoke") whose pods become Ready via a gRPC readiness probe. The
# k8s/agnhost `grpc-health-checking` server answers the standard gRPC health
# protocol on :5000, so the probe passes and readyReplicas == replicas — the
# shape `pool-healthcheck` certifies as healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-smoke-broker
  labels:
    app: task-smoke-broker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-smoke-broker
  template:
    metadata:
      labels:
        app: task-smoke-broker
    spec:
      containers:
        - name: broker
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["grpc-health-checking"]
          ports:
            - containerPort: 5000
            - containerPort: 8080
          readinessProbe:
            grpc:
              port: 5000
            initialDelaySeconds: 1
            periodSeconds: 2
