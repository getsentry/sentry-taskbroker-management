[mypy]
ignore_missing_imports = False

[sentry_taskbroker_management.*]
follow_untyped_imports = True

# `workflows` repeats its kubernetes import in each step function, because each
# function body is inlined as the whole script of a container and cannot read a
# module-level import. mypy reports an untyped import once per file, so only the
# first of those ignores counts as used.
[mypy-sentry_taskbroker_management.workflows.killswitch]
warn_unused_ignores = False
